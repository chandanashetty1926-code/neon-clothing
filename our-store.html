<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Store - NEON CLOTHING</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        .store-page {
            background: #fff;
        }

        .store-hero {
            text-align: center;
            padding: 70px 20px 60px;
        }

        .store-hero span {
            font-size: 11px;
            letter-spacing: 4px;
            color: #777;
        }

        .store-hero h1 {
            margin: 18px 0 12px;
            font-size: 48px;
            font-weight: 400;
        }

        .store-hero p {
            color: #666;
            font-size: 14px;
        }

        .store-content {
            max-width: 1300px;
            margin: auto;
            padding: 20px 50px 100px;

            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 70px;

            align-items: center;
        }

        .store-map {
            width: 100%;
            height: 500px;

            border: 0;
            display: block;
        }

        .store-info h2 {
            font-size: 34px;
            font-weight: 400;
            margin: 0 0 35px;
        }

        .store-info-block {
            margin-bottom: 28px;
        }

        .store-info-block h4 {
            margin: 0 0 9px;

            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .store-info-block p {
            margin: 0;

            color: #666;
            line-height: 1.7;
            font-size: 14px;
        }

        .store-direction {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            margin-top: 10px;

            padding: 15px 23px;

            border: 1px solid #111;

            color: #111;
            text-decoration: none;

            font-size: 13px;
            font-weight: 700;
        }

        .store-direction:hover {
            background: #111;
            color: #fff;
        }


        @media (max-width: 800px) {

            .store-hero h1 {
                font-size: 38px;
            }

            .store-content {
                padding: 20px;
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .store-map {
                height: 350px;
            }

        }

    </style>

</head>


<body>

    {% include 'navbar.html' %}


    <main class="store-page">


        <section class="store-hero">

            <span>
                NEON CLOTHING
            </span>

            <h1>
                Our Store
            </h1>

            <p>
                Home &nbsp;›&nbsp; Our Store
            </p>

        </section>


        <section class="store-content">


            <!-- MAP -->

            <div>

                <iframe
                    class="store-map"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3887.4851434061748!2d77.4875271!3d13.0047482!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae3d005bd7f157%3A0x76b2cd3fe8382ea2!2sNeon%20clothing!5e0!3m2!1sen!2sin!4v1788932909829!5m2!1sen!2sin"
                    allowfullscreen
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"
                ></iframe>

            </div>


            <!-- STORE INFORMATION -->

            <div class="store-info">

                <h2>
                    Visit Neon Clothing
                </h2>


                <div class="store-info-block">

                    <h4>
                        Address
                    </h4>

                    <p>
                        No 77A, 10th Cross,
                        <br>
                        Vidyamanya Nagar,
                        <br>
                        Andhrahalli, Bengaluru,
                        <br>
                        Karnataka 560091, India
                    </p>

                </div>


                <div class="store-info-block">

                    <h4>
                        Phone
                    </h4>

                    <p>
                        Contact us for store assistance.
                    </p>

                </div>


                <div class="store-info-block">

                    <h4>
                        Open Time
                    </h4>

                    <p>
                        Monday – Sunday
                        <br>
                        10:00 AM – 10:00 PM
                    </p>

                </div>


                <a
                    href="https://maps.app.goo.gl/HQtNrXv9GTfzYJT59?g_st=iw"
                    target="_blank"
                    class="store-direction"
                >
                    GET DIRECTIONS
                    <span>→</span>
                </a>

            </div>

        </section>

    </main>

</body>

</html>

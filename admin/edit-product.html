<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product - Neon Clothing</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

   body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #111111;
}


.main {
    margin-left: 250px;
    min-height: 100vh;
    background: #f2f3f5;
}


        .navbar {
            height: 70px;
            background: #111111;
            border-bottom: 1px solid #292929;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .logo {
            color: #dfff00;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .back-link {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid #444444;
            border-radius: 6px;
            transition: 0.3s;
        }

        .back-link:hover {
            border-color: #dfff00;
            color: #dfff00;
        }

        .page-container {
            width: 100%;
            max-width: 900px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            color: #dfff00;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #999999;
            font-size: 14px;
        }

        .form-card {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 32px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            color: #dddddd;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            background: #0b0b0b;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #dfff00;
            box-shadow: 0 0 0 2px rgba(223, 255, 0, 0.08);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .current-image {
            margin-top: 10px;
        }

        .current-image img {
            width: 120px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333333;
            display: block;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }

        .update-btn {
            background: #dfff00;
            color: #000000;
        }

        .update-btn:hover {
            background: #c9e600;
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: #222222;
            color: #ffffff;
            border: 1px solid #444444;
        }

        .cancel-btn:hover {
            border-color: #dfff00;
            color: #dfff00;
        }

        .notice {
            margin-bottom: 20px;
            padding: 12px 15px;
            background: #171717;
            border-left: 4px solid #dfff00;
            border-radius: 5px;
            color: #bbbbbb;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 18px;
            }

            .logo {
                font-size: 20px;
            }

            .page-container {
                margin: 30px auto;
            }

            .form-card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <div class="navbar">

        <div class="logo">
            NEON CLOTHING
        </div>

        <a
            href="/admin/products"
            class="back-link"
        >
            ← Back to Products
        </a>

    </div>


    <!-- ========================= -->
    <!-- PAGE -->
    <!-- ========================= -->

    <div class="page-container">

        <div class="page-title">

            <h1>
                Edit Product
            </h1>

            <p>
                Update the product information below.
            </p>

        </div>


        <div class="notice">

            Product ID:
            <strong>
                #{{ product["id"] }}
            </strong>

        </div>


        <!-- ========================= -->
        <!-- FORM -->
        <!-- ========================= -->

        <div class="form-card">

            <form
                method="POST"
                action="/admin/edit-product/{{ product['id'] }}"
            >

                <div class="form-grid">


                    <!-- PRODUCT NAME -->

                    <div class="form-group full">

                        <label for="name">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            value="{{ product['name'] }}"
                            placeholder="Enter product name"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option
                                value="T-Shirts"
                                {% if product["category"] == "T-Shirts" %}
                                selected
                                {% endif %}
                            >
                                T-Shirts
                            </option>

                            <option
                                value="Shirts"
                                {% if product["category"] == "Shirts" %}
                                selected
                                {% endif %}
                            >
                                Shirts
                            </option>

                            <option
                                value="Jeans"
                                {% if product["category"] == "Jeans" %}
                                selected
                                {% endif %}
                            >
                                Jeans
                            </option>

                            <option
                                value="Track Pants"
                                {% if product["category"] == "Track Pants" %}
                                selected
                                {% endif %}
                            >
                                Track Pants
                            </option>

                            <option
                                value="Jerseys"
                                {% if product["category"] == "Jerseys" %}
                                selected
                                {% endif %}
                            >
                                Jerseys
                            </option>

                            <option
                                value="Hoodies"
                                {% if product["category"] == "Hoodies" %}
                                selected
                                {% endif %}
                            >
                                Hoodies
                            </option>

                        </select>

                    </div>


                    <!-- PRICE -->

                    <div class="form-group">

                        <label for="price">
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            value="{{ product['price'] }}"
                            min="1"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- DISCOUNT -->

                    <div class="form-group">

                        <label for="discount">
                            Discount (%)
                        </label>

                        <input
                            type="number"
                            id="discount"
                            name="discount"
                            value="{{ product.get('discount', 0) }}"
                            min="0"
                            max="100"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- STOCK -->

                    <div class="form-group">

                        <label for="stock">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="stock"
                            name="stock"
                            value="{{ product.get('stock', 0) }}"
                            min="0"
                            required
                        >

                    </div>


                    <!-- IMAGE -->

                    <div class="form-group full">

                        <label for="image">
                            Product Image URL
                        </label>

                        <input
                            type="url"
                            id="image"
                            name="image"
                            value="{{ product['image'] }}"
                            placeholder="https://example.com/image.jpg"
                            required
                        >


                        <!-- CURRENT IMAGE -->

                        <div class="current-image">

                            <img
                                src="{{ product['image'] }}"
                                alt="{{ product['name'] }}"
                                onerror="this.style.display='none'"
                            >

                        </div>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group full">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter product description"
                            required
                        >{{ product['description'] }}</textarea>

                    </div>

                </div>


                <!-- ========================= -->
                <!-- BUTTONS -->
                <!-- ========================= -->

                <div class="actions">

                    <button
                        type="submit"
                        class="btn update-btn"
                    >
                        Update Product
                    </button>

                    <a
                        href="/admin/products"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
